<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>知识图谱的规模与构成</title>
  <desc>125 个知识点按七种类型和三个难度档位标定，全部挂有教材出处。179 条先修边中强依赖 165 条、弱关联 14 条，另有 12 条跨章关联边。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">知识图谱的规模与构成</text>
  <text x="64" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">覆盖《电动力学》一门课的自建图谱，不是从公开资源里拿来即用的</text>

  <rect x="64" y="140" width="576" height="260" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="172" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">125 个知识点 · 按类型</text>

  <text x="88" y="212" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">概念</text>
  <rect x="196" y="200" width="380" height="16" rx="4" fill="#0F6E56"/>
  <text x="586" y="213" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">58</text>

  <text x="88" y="239" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">规律</text>
  <rect x="196" y="227" width="138" height="16" rx="4" fill="#1D9E75"/>
  <text x="344" y="240" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">21</text>

  <text x="88" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">方法</text>
  <rect x="196" y="254" width="111" height="16" rx="4" fill="#1D9E75"/>
  <text x="317" y="267" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">17</text>

  <text x="88" y="293" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">现象</text>
  <rect x="196" y="281" width="72" height="16" rx="4" fill="#5DCAA5"/>
  <text x="278" y="294" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">11</text>

  <text x="88" y="320" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">方程</text>
  <rect x="196" y="308" width="66" height="16" rx="4" fill="#5DCAA5"/>
  <text x="272" y="321" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">10</text>

  <text x="88" y="347" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">应用</text>
  <rect x="196" y="335" width="46" height="16" rx="4" fill="#9FE1CB"/>
  <text x="252" y="348" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">7</text>

  <text x="88" y="374" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">实验</text>
  <rect x="196" y="362" width="8" height="16" rx="4" fill="#9FE1CB"/>
  <text x="214" y="375" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">1</text>

  <rect x="672" y="140" width="544" height="260" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="696" y="172" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">179 条先修边 · 按强度</text>

  <rect x="696" y="196" width="371" height="34" rx="6" fill="#534AB7"/>
  <text x="881" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#FFFFFF">强依赖　165 条</text>
  <rect x="1071" y="196" width="121" height="34" rx="6" fill="#AFA9EC"/>
  <text x="1131" y="219" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#26215C">弱关联 14</text>

  <text x="696" y="264" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#64748B">强依赖：不掌握先修，后继几乎无法理解</text>
  <text x="696" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#64748B">弱关联：有帮助，但不是必须的前置</text>

  <rect x="696" y="312" width="496" height="64" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="720" y="338" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#3C3489">每条边都带一句「为什么它是先修」</text>
  <text x="720" y="361" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#534AB7">例：混合积建立在标积与矢积之上，三种运算的定义必须先清楚。</text>

  <rect x="64" y="428" width="274" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#0E7A5C">41</text>
  <text x="88" y="512" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">节　课程结构骨架</text>

  <rect x="356" y="428" width="274" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="380" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#0E7A5C">138</text>
  <text x="380" y="512" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">条公式　全部 LaTeX 化</text>

  <rect x="648" y="428" width="274" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="672" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#0E7A5C">125/125</text>
  <text x="672" y="512" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">知识点带教材出处</text>

  <rect x="940" y="428" width="276" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="964" y="484" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="500" fill="#0E7A5C">12</text>
  <text x="964" y="512" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">条跨章关联边（如对称类比）</text>

  <rect x="64" y="568" width="1152" height="104" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="88" y="600" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#412402">要注意的是：现成资源里没有这套图</text>
  <text x="88" y="626" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#854F0B">公开的课程知识图谱只做到「章节包含哪些知识点」这一层，也就是 Graph A 的部分。</text>
  <text x="88" y="650" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#854F0B">涉及教学判断的先修关系（Graph B）在任何公开资源中都不存在，只能依据物理逻辑自建，这才是真正花时间的部分。</text>
</svg>
