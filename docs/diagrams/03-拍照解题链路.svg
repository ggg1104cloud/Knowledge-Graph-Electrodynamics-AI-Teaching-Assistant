<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>拍照解题链路</title>
  <desc>六个步骤的流程与耗时分布。核查解答与生成引导各占四成左右时间，且期间不产生任何事件，因此系统每四秒推送一次心跳保持过程可见。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">拍照解题链路</text>
  <text x="64" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">一次完整分析 60~90 秒，其中八成时间花在两个模型调用上</text>

  <rect x="64" y="196" width="168" height="112" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="148" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">质量预检</text>
  <text x="148" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#5F5E5A">分辨率 / 亮度</text>
  <text x="148" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#5F5E5A">对比度 / 反光</text>
  <text x="148" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#888780">本地完成，不到 1 秒</text>

  <rect x="258" y="196" width="168" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="342" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#085041">视觉识别</text>
  <text x="342" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">题干 + 公式转 LaTeX</text>
  <text x="342" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">自报不确定处</text>
  <text x="342" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">约 4~8 秒</text>

  <rect x="452" y="196" width="168" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="536" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#085041">图谱定位</text>
  <text x="536" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">标记涉及的知识点</text>
  <text x="536" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">纯图运算</text>
  <text x="536" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">约 4~6 秒</text>

  <rect x="646" y="196" width="168" height="112" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="730" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#633806">核查解答</text>
  <text x="730" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">判断自带解答</text>
  <text x="730" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">每条结论要原文依据</text>
  <text x="730" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">约 22~48 秒</text>

  <rect x="840" y="196" width="168" height="112" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="924" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#085041">回溯先修</text>
  <text x="924" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">找真正断裂的基础</text>
  <text x="924" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">纯图运算</text>
  <text x="924" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">约 0.1 秒</text>

  <rect x="1034" y="196" width="168" height="112" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="1118" y="228" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#633806">生成引导</text>
  <text x="1118" y="254" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">一次只推进一步</text>
  <text x="1118" y="272" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">不给答案</text>
  <text x="1118" y="294" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">约 27~32 秒</text>

  <line x1="232" y1="252" x2="252" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="426" y1="252" x2="446" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="252" x2="640" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="814" y1="252" x2="834" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="1008" y1="252" x2="1028" y2="252" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="64" y="368" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#1E293B">时间都去哪儿了</text>

  <rect x="64" y="386" width="6" height="40" fill="#B4B2A9"/>
  <rect x="70" y="386" width="103" height="40" fill="#5DCAA5"/>
  <rect x="173" y="386" width="74" height="40" fill="#5DCAA5"/>
  <rect x="247" y="386" width="512" height="40" fill="#EF9F27"/>
  <rect x="759" y="386" width="2" height="40" fill="#5DCAA5"/>
  <rect x="761" y="386" width="441" height="40" fill="#EF9F27"/>

  <text x="148" y="412" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#2C2C2A">识别</text>
  <text x="503" y="412" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#412402">核查解答　45%</text>
  <text x="981" y="412" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#412402">生成引导　39%</text>

  <text x="64" y="450" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">图运算（定位、回溯）几乎不耗时，橙色两段合计占全程约 84%</text>

  <rect x="64" y="486" width="1138" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="516" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#1E293B">橙色两段各是一次完整的模型调用，期间一个事件都不产生</text>
  <text x="88" y="540" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#64748B">进度条会干停在 72% 或 96% 不动，观感和死机没有区别。所以做了三层保障：</text>

  <rect x="88" y="562" width="340" height="54" rx="9" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="108" y="586" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#085041">服务端每 4 秒推一次心跳</text>
  <text x="108" y="606" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">界面上的「已耗时」持续跳动</text>

  <rect x="460" y="562" width="340" height="54" rx="9" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="480" y="586" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#085041">前端 20 秒无事件即报错</text>
  <text x="480" y="606" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">链路真断了绝不让人干等</text>

  <rect x="832" y="562" width="340" height="54" rx="9" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="852" y="586" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#085041">模型超时收紧到 60~90 秒</text>
  <text x="852" y="606" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">避免真卡住时静默近三分钟</text>

  <text x="64" y="678" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">契约测试锁死这两条：全程必须有心跳事件，且相邻事件间隔小于 10 秒。</text>
</svg>
