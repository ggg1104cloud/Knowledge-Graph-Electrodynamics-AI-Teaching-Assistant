<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>根因回溯</title>
  <desc>学生只能说出几块都学不懂，系统沿先修链向上回溯，找出这几块共同依赖的基础，并指给他看。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">根因回溯：从「我哪里不懂」到「我该补什么」</text>
  <text x="64" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">学生说不清自己缺哪一层，但系统可以算出来</text>

  <line x1="92" y1="560" x2="92" y2="300" stroke="#0E7A5C" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="104" y="288" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#0E7A5C">回溯方向</text>

  <rect x="340" y="294" width="290" height="56" rx="11" fill="#0F6E56" stroke="#085041" stroke-width="1"/>
  <text x="485" y="318" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF">矢量分析与场论</text>
  <text x="485" y="339" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#9FE1CB">三块的共同前提 · 真正该补的地方</text>

  <line x1="225" y1="528" x2="428" y2="466" stroke="#854F0B" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="475" y1="528" x2="483" y2="466" stroke="#854F0B" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="725" y1="528" x2="540" y2="466" stroke="#854F0B" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="485" y1="412" x2="485" y2="352" stroke="#0E7A5C" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="360" y="412" width="250" height="52" rx="11" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
  <text x="485" y="434" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#633806">麦克斯韦方程组</text>
  <text x="485" y="454" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">上一层依赖</text>

  <rect x="120" y="530" width="210" height="52" rx="11" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="225" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="500" fill="#501313">平面电磁波</text>
  <text x="225" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#A32D2D">学生说学不懂</text>

  <rect x="370" y="530" width="210" height="52" rx="11" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="475" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="500" fill="#501313">电磁波的辐射</text>
  <text x="475" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#A32D2D">学生说学不懂</text>

  <rect x="620" y="530" width="210" height="52" rx="11" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="725" y="552" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14.5" font-weight="500" fill="#501313">介质界面上的反射</text>
  <text x="725" y="572" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#A32D2D">学生说学不懂</text>

  <rect x="936" y="294" width="280" height="288" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="960" y="326" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">这一步解决什么</text>
  <text x="960" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">学生只能说出「这几块我都学</text>
  <text x="960" y="381" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">不懂」，说不出缺的是哪一层。</text>
  <text x="960" y="419" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">教材是线性编排的，看不出知</text>
  <text x="960" y="440" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">识之间的依赖关系。</text>
  <text x="960" y="478" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">系统沿先修链上溯，找出这几</text>
  <text x="960" y="499" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#64748B">块共同依赖的那个基础。</text>
  <text x="960" y="537" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">整条回溯是图运算，结果可复</text>
  <text x="960" y="558" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">现，不是模型猜出来的。</text>

  <rect x="64" y="614" width="1152" height="72" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="88" y="644" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#085041">知识图谱在这里的价值</text>
  <text x="88" y="670" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#0F6E56">把「我哪里不懂」这种模糊的感受，变成一条可以指给学生看的依赖路径。学生顺着它往回走，才可能真正修好。</text>
</svg>
