<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>电动力学 AI 助教 · 系统总览</title>
  <desc>三层架构：学生入口、服务端编排与校验、两个底座（知识图谱与大模型）。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="66" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">电动力学 AI 助教 · 系统总览</text>
  <text x="64" y="98" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">知识图谱负责事实与关系，大模型负责把已算好的结论讲清楚</text>

  <rect x="64" y="124" width="1152" height="132" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="152" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">学生入口 · 三个能力</text>

  <rect x="88" y="168" width="349" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="262" y="196" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#085041">概念答疑</text>
  <text x="262" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">每句话标注依据来源</text>

  <rect x="465" y="168" width="349" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="639" y="196" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#085041">拍照解题</text>
  <text x="639" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">识别 → 定位 → 诊断 → 引导</text>

  <rect x="842" y="168" width="349" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="1016" y="196" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="500" fill="#085041">根因诊断</text>
  <text x="1016" y="220" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0F6E56">找出真正断裂的基础</text>

  <line x1="262" y1="256" x2="262" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="639" y1="256" x2="639" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="1016" y1="256" x2="1016" y2="280" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="64" y="284" width="1152" height="120" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="312" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">服务端编排与校验</text>

  <rect x="88" y="328" width="1103" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <line x1="456" y1="340" x2="456" y2="376" stroke="#B5D4F4" stroke-width="1"/>
  <line x1="822" y1="340" x2="822" y2="376" stroke="#B5D4F4" stroke-width="1"/>
  <text x="272" y="350" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">图运算前置</text>
  <text x="272" y="371" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#185FA5">先修链·共同根因由图谱算出</text>
  <text x="639" y="350" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">引用校验</text>
  <text x="639" y="371" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#185FA5">编造的节点 ID 当场拦下</text>
  <text x="1006" y="350" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">流式输出 + 心跳</text>
  <text x="1006" y="371" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#185FA5">60~90 秒的过程始终可见</text>

  <line x1="348" y1="404" x2="348" y2="428" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="912" y1="404" x2="912" y2="428" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="64" y="432" width="1152" height="176" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="460" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">两个底座 · 一个给事实，一个给语言</text>

  <rect x="88" y="476" width="520" height="112" rx="10" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="112" y="504" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#085041">知识图谱（Kuzu 图数据库）</text>
  <text x="112" y="532" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#0F6E56">Graph A 章节树　8 章 / 41 节 / 125 个知识点</text>
  <text x="112" y="555" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#0F6E56">Graph B 先修 DAG　179 条先修边 + 12 条关联边</text>
  <text x="112" y="578" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#0F6E56">全部知识点挂教材出处（郭硕鸿《电动力学》）</text>

  <rect x="632" y="476" width="560" height="112" rx="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
  <text x="656" y="504" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#3C3489">大模型（GLM）</text>
  <text x="656" y="532" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#534AB7">glm-5.3-flash　答疑、解答核查、生成引导</text>
  <text x="656" y="555" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#534AB7">glm-4v-plus　题目照片直读，公式转 LaTeX</text>
  <text x="656" y="578" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#534AB7">只负责组织语言，不负责判断学生哪里不行</text>

  <text x="64" y="656" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">图谱为自建资产：Graph B 的先修关系在任何公开资源中都不存在，须依据物理逻辑手工构建。</text>
</svg>
