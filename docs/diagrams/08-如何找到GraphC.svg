<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>如何找到 Graph C，以及它长什么样</title>
  <desc>路径一：左栏课程结构 → 第 4 章 → 4.1 平面电磁波 → 右栏知识点页 → 拉到最底部。路径二：直接用 #node=知识点ID&amp;tab=detail 深链接。目前只有 5 个知识点带推导链。右侧是「它是怎么来的」区块的结构。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">如何找到 Graph C</text>
  <text x="64" y="94" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">它藏在「知识点」页的底部 —— 因为它是学生看完概念之后才会问的下一个问题</text>

  <rect x="64" y="126" width="560" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">两条路径</text>

  <text x="88" y="192" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#854F0B">路径一 · 从界面点进去</text>
  <circle cx="96" cy="214" r="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="96" y="218" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#854F0B">1</text>
  <text x="114" y="218" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">左栏「课程结构」→ 第 4 章 电磁波的传播</text>
  <circle cx="96" cy="238" r="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="96" y="242" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#854F0B">2</text>
  <text x="114" y="242" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">→ 4.1 平面电磁波</text>
  <circle cx="96" cy="262" r="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="96" y="266" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#854F0B">3</text>
  <text x="114" y="266" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">→ 点节点「平面电磁波」（树里或画布上都行）</text>
  <circle cx="96" cy="286" r="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="96" y="290" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#854F0B">4</text>
  <text x="114" y="290" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">→ 右栏自动切到「知识点」页</text>
  <circle cx="96" cy="310" r="9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="96" y="314" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#854F0B">5</text>
  <text x="114" y="314" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">→ 拉到最底：「它是怎么来的」</text>

  <text x="88" y="350" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#854F0B">路径二 · 直接用深链接</text>
  <rect x="88" y="366" width="512" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="104" y="391" font-family="Consolas, monospace" font-size="13" fill="#1E293B">#node=kp_plane_wave&amp;tab=detail</text>
  <text x="88" y="430" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748B">#node= 是知识点 ID；&amp;tab=detail 打开「知识点」页（截图验收也走这条）</text>

  <text x="88" y="462" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#1E293B">目前只有 5 个知识点带推导链</text>
  <rect x="88" y="474" width="240" height="28" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="208" y="492" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">平面电磁波　§4.1</text>
  <rect x="340" y="474" width="260" height="28" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="470" y="492" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">亥姆霍兹方程　§4.1</text>
  <rect x="88" y="510" width="240" height="28" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="208" y="528" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">电磁场波动方程　§4.1</text>
  <rect x="340" y="510" width="260" height="28" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="470" y="528" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">麦克斯韦方程组　§1.3</text>
  <rect x="88" y="546" width="512" height="28" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="344" y="564" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#633806">电场强度　§1.1　—— 这条链上有一个环：E ⇄ B 互相定出</text>

  <rect x="656" y="126" width="560" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="680" y="158" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">「它是怎么来的」长什么样</text>
  <rect x="680" y="172" width="152" height="24" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="756" y="189" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#854F0B">Graph C · 数学推导</text>

  <rect x="696" y="210" width="480" height="38" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="712" y="228" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#085041">平面波解</text>
  <rect x="772" y="218" width="42" height="18" rx="9" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="793" y="232" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0F6E56">解</text>
  <text x="712" y="243" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">E = E₀ e^(i(k·r − ωt))</text>

  <line x1="712" y1="256" x2="712" y2="294" stroke="#EF9F27" stroke-width="2"/>
  <text x="726" y="272" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#854F0B">← 分离变数</text>
  <text x="726" y="289" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">在直角坐标下设 E = X(x)Y(y)Z(z)，分离变数后化为常微分方程</text>

  <rect x="696" y="298" width="480" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="712" y="316" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#1E293B">亥姆霍兹方程</text>
  <rect x="798" y="306" width="48" height="18" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="822" y="320" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748B">方程</text>
  <text x="712" y="331" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">∇²E + k²E = 0</text>

  <line x1="712" y1="344" x2="712" y2="382" stroke="#EF9F27" stroke-width="2"/>
  <text x="726" y="360" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#854F0B">← 化为定态方程</text>
  <text x="726" y="377" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">单色场代入波动方程，得 ∇²E + (ω²/c²)E = 0，记 k = ω/c</text>

  <rect x="696" y="386" width="480" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="712" y="404" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#1E293B">电磁场波动方程</text>
  <rect x="812" y="394" width="48" height="18" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="836" y="408" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748B">方程</text>
  <text x="712" y="419" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">∇²E − (1/c²) ∂²E/∂t² = 0</text>

  <line x1="712" y1="432" x2="712" y2="470" stroke="#EF9F27" stroke-width="2"/>
  <text x="726" y="448" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#854F0B">← 取旋度并代入</text>
  <text x="726" y="465" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#64748B">对 ∇×E = −∂B/∂t 取旋度，用 ∇×B 代入，整理即得</text>

  <rect x="696" y="474" width="480" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="712" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#1E293B">麦克斯韦方程组（无源真空）</text>
  <rect x="884" y="482" width="48" height="18" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="908" y="496" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#64748B">方程</text>

  <text x="696" y="534" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#94A3B8">本条链依赖的前提（去掉任何一条，上面的推导都不成立）</text>
  <rect x="696" y="542" width="140" height="26" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="766" y="559" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#854F0B">定态（单色）假设</text>
  <rect x="846" y="542" width="130" height="26" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="911" y="559" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#854F0B">无源真空假设</text>
  <text x="696" y="588" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#94A3B8">每条边都要求写出可展开的推导步骤 —— 这是 Graph C 的校验目标</text>

  <rect x="64" y="620" width="1152" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="644" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1E293B">Graph C 不是「又一张图」—— 它换了一个问题来问同一批知识点：这个式子是怎么被推出来的。</text>
  <text x="88" y="666" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">与上面的「直接先修」不同：那里是教学顺序（必须无环），这里是数学推导（允许成环）。</text>
</svg>
