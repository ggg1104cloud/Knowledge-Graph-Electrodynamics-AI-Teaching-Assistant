<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img">
  <title>三族关系在界面上的落点</title>
  <desc>Graph A 落在左栏课程结构树；Graph B 落在中栏关系画布与右栏知识点、根因诊断页；Graph C 落在右栏「知识点」页最底部的「它是怎么来的」区块。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <text x="64" y="62" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="500" fill="#1E293B">三族关系在界面上的落点</text>
  <text x="64" y="94" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#64748B">图谱不是后台数据 —— 每一族关系在界面上都有可点的入口，学生不需要知道「图」这个词</text>

  <rect x="64" y="126" width="364" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#085041">左栏 · 课程结构</text>
  <rect x="88" y="176" width="148" height="26" rx="13" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="162" y="194" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#085041">Graph A · 结构关系</text>
  <text x="88" y="230" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11.5" fill="#94A3B8">章节树：三层</text>
  <rect x="110" y="240" width="272" height="38" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="246" y="264" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13.5" fill="#085041">第 4 章　电磁波的传播</text>
  <line x1="246" y1="278" x2="246" y2="292" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="170" y1="292" x2="322" y2="292" stroke="#94A3B8" stroke-width="1.2"/>
  <line x1="170" y1="292" x2="170" y2="304" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="322" y1="292" x2="322" y2="304" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="110" y="306" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="170" y="327" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">4.1 平面电磁波</text>
  <rect x="262" y="306" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="322" y="327" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#0F6E56">4.2 反射与折射</text>
  <line x1="170" y1="340" x2="170" y2="354" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="322" y1="340" x2="322" y2="354" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="110" y="356" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="170" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">平面电磁波</text>
  <rect x="262" y="356" width="120" height="34" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="322" y="377" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">亥姆霍兹方程</text>
  <text x="88" y="428" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">8 章 / 41 节 / 125 个知识点</text>
  <text x="88" y="454" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">点树中任一项 = 选中该知识点</text>
  <text x="88" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">它只负责「在哪儿」，不参与推理</text>
  <line x1="88" y1="510" x2="404" y2="510" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="538" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94A3B8">点完之后，中栏与右栏会同步跟着变</text>

  <rect x="458" y="126" width="364" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="482" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#3C3489">中栏 · 关系画布</text>
  <rect x="482" y="176" width="170" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="567" y="194" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#3C3489">Graph B · 先修与关联</text>

  <line x1="520" y1="250" x2="600" y2="228" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="600" y1="228" x2="680" y2="258" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="520" y1="250" x2="548" y2="320" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="548" y1="320" x2="628" y2="300" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="628" y1="300" x2="712" y2="330" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="712" y1="330" x2="770" y2="300" stroke="#AFA9EC" stroke-width="1"/>
  <line x1="680" y1="258" x2="628" y2="300" stroke="#534AB7" stroke-width="2.6"/>
  <line x1="628" y1="300" x2="660" y2="376" stroke="#534AB7" stroke-width="2.6"/>
  <line x1="680" y1="258" x2="760" y2="232" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="520" cy="250" r="13" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <circle cx="600" cy="228" r="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <circle cx="680" cy="258" r="14" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <circle cx="760" cy="232" r="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <circle cx="548" cy="320" r="11" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <circle cx="628" cy="300" r="15" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <circle cx="712" cy="330" r="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <circle cx="770" cy="300" r="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <circle cx="660" cy="376" r="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>

  <line x1="482" y1="436" x2="520" y2="436" stroke="#534AB7" stroke-width="2.6"/>
  <text x="530" y="441" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">粗实线 = 强先修</text>
  <line x1="482" y1="460" x2="520" y2="460" stroke="#AFA9EC" stroke-width="1"/>
  <text x="530" y="465" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">细实线 = 弱先修</text>
  <line x1="482" y1="484" x2="520" y2="484" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="530" y="489" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">虚线 = 主题关联</text>

  <rect x="482" y="506" width="52" height="26" rx="13" fill="#534AB7"/>
  <text x="508" y="524" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#FFFFFF">全书</text>
  <rect x="544" y="506" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="596" y="524" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748B">当前节点邻域</text>
  <rect x="658" y="506" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="706" y="524" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#64748B">只显示先修</text>

  <text x="482" y="562" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">点一条边 → 弹出关系卡片（具名关系 + 属性）</text>
  <text x="482" y="584" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94A3B8">卡片上可打开「关系词表」（41 种 / 7 族）</text>

  <rect x="852" y="126" width="364" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="876" y="160" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#1E293B">右栏 · 三个页签</text>
  <rect x="876" y="176" width="134" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="943" y="194" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#3C3489">Graph B · 诊断</text>
  <rect x="1018" y="176" width="134" height="26" rx="13" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="1085" y="194" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">Graph C · 推导</text>

  <rect x="876" y="214" width="292" height="30" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="924" y="234" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#94A3B8">答疑</text>
  <text x="1022" y="234" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#1E293B">知识点</text>
  <text x="1120" y="234" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#94A3B8">根因诊断</text>
  <line x1="990" y1="244" x2="1054" y2="244" stroke="#0E7A5C" stroke-width="2"/>

  <circle cx="882" cy="272" r="2.5" fill="#534AB7"/>
  <text x="896" y="277" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">「答疑」— 回答里的绿色标记 = 图谱知识点</text>
  <circle cx="882" cy="302" r="2.5" fill="#534AB7"/>
  <text x="896" y="307" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">「知识点」— 直接先修 / 后续依赖它 / 关联</text>
  <circle cx="882" cy="332" r="2.5" fill="#534AB7"/>
  <text x="896" y="337" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#1E293B">「根因诊断」— 勾选症状 → 沿先修链回溯</text>

  <rect x="876" y="364" width="292" height="150" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="896" y="390" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#854F0B">「知识点」页最底部</text>
  <text x="896" y="414" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#854F0B">区块标题：「它是怎么来的」</text>
  <text x="896" y="440" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#633806">起点 → ← 推导动作 → 更基础的式子</text>
  <text x="896" y="464" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#633806">再往下：本条链依赖的前提</text>
  <text x="896" y="488" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#633806">有环时显式警告（见「电场强度」）</text>

  <text x="876" y="542" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94A3B8">只有 5 个知识点带推导链，见附图 08</text>
  <text x="876" y="566" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#94A3B8">也可用 #node=…&amp;tab=detail 直达</text>

  <rect x="64" y="620" width="1152" height="58" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="644" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1E293B">三族关系在界面上各有一个可点的入口 —— 没有一族只停在数据文件里。</text>
  <text x="88" y="666" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" fill="#64748B">Graph A 说「在哪儿」，Graph B 说「该补什么」，Graph C 说「怎么来的」。</text>
</svg>
